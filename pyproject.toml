[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leypilot"
version = "0.1.0"
description = "Copilote de veille réglementaire pour les consultants"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "jinja2>=3.1",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
calcul = ["openfisca-core>=41"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["leypilot*", "openfisca_leypilot*"]

[tool.setuptools.package-data]
"leypilot.commun.llm" = ["prompts/*.toml"]
"leypilot.mesure" = ["sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
